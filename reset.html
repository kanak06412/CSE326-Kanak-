<!DOCTYPE html>
<html>
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Reset password &middot; Campus Connect
  </title>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="auth">
   <section class="auth-side">
    <div class="brand">
     <span class="brand-mark">
      CC
     </span>
     <div>
      Campus Connect
      <small>
       College community platform
      </small>
     </div>
    </div>
    <h1>
     Reset your password.
    </h1>
    <p>
     We'll send a password reset link to your registered email.
    </p>
   </section>
   <section class="auth-card">
    <div class="auth-box">
     <h2>
      Reset password
     </h2>
     <p>
      Enter your account email.
     </p>
     <div class="alert error" hidden="" id="message">
     </div>
     <form class="form-grid" id="reset-form">
      <div class="field">
       <label>
        Email
       </label>
       <input id="email" required="" type="email"/>
      </div>
      <button class="btn">
       Send reset link
      </button>
     </form>
     <div class="auth-foot">
      <a class="auth-link" href="login.html">
       Back to login
      </a>
     </div>
    </div>
   </section>
  </div>
  <script src="js/auth.js" type="module">
  </script>
 </body>
</html>
