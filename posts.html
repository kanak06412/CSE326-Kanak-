<!DOCTYPE html>
<html>
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Community Posts &middot; Campus Connect
  </title>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="app">
   <aside class="sidebar">
    <div class="brand">
     <span class="brand-mark">
      CC
     </span>
     <div>
      Campus Connect
      <small>
       College community
      </small>
     </div>
    </div>
    <nav class="nav">
     <a class="" href="chat.html">
      💬 Community Chat
     </a>
     <a class="active" href="posts.html">
      ▤ Posts
     </a>
     <a class="" href="profile.html">
      ◉ Profile
     </a>
     <a class="" href="admin.html">
      ⚙ Admin
     </a>
    </nav>
    <div class="sidebar-bottom">
     <div class="user-mini">
      <b data-user-name="">
       Student
      </b>
      <span data-user-username="">
       @student
      </span>
     </div>
     <button class="logout" id="logout">
      &rarrhk; Log out
     </button>
    </div>
   </aside>
   <main class="main">
    <header class="topbar">
     <div style="display:flex;align-items:center;gap:10px">
      <button class="mobile-menu">
       ☰
      </button>
      <div>
       <h1>
        Community Posts
       </h1>
       <p>
        Campus-wide community
       </p>
      </div>
     </div>
     <div class="top-actions">
      <div class="avatar" data-avatar="">
       ST
      </div>
     </div>
    </header>
    <div class="container">
     <div class="grid grid-2">
      <section class="card">
       <div class="section-title">
        <h2>
         Create a post
        </h2>
       </div>
       <div class="form-grid">
        <div class="field">
         <label>
          Title
         </label>
         <input id="title" placeholder="e.g. Placement drive tomorrow"/>
        </div>
        <div class="field">
         <label>
          Description
         </label>
         <textarea id="body" placeholder="Write the details..."></textarea>
        </div>
        <div class="field">
         <label>
          Tags
         </label>
         <div class="tags" id="post-tags">
         </div>
        </div>
        <button class="btn" id="create-post">
         Publish post
        </button>
       </div>
      </section>
      <section class="card">
       <div class="section-title">
        <h2>
         Find posts
        </h2>
       </div>
       <div class="search">
        <input id="post-search" placeholder="Search posts..."/>
        <select id="post-filter">
        </select>
       </div>
      </section>
     </div>
     <div class="card" style="margin-top:20px">
      <div class="grid" id="posts">
      </div>
     </div>
    </div>
   </main>
  </div>
  <script src="js/posts.js" type="module">
  </script>
 </body>
</html>
