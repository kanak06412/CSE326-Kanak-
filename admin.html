<!DOCTYPE html>
<html>
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Admin Dashboard &middot; Campus Connect
  </title>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="app">
   <aside class="sidebar">
    <div class="brand">
     <span class="brand-mark">
      CC
     </span>
     <div>
      Campus Connect
      <small>
       College community
      </small>
     </div>
    </div>
    <nav class="nav">
     <a class="" href="chat.html">
      💬 Community Chat
     </a>
     <a class="" href="posts.html">
      ▤ Posts
     </a>
     <a class="" href="profile.html">
      ◉ Profile
     </a>
     <a class="active" href="admin.html">
      ⚙ Admin
     </a>
    </nav>
    <div class="sidebar-bottom">
     <div class="user-mini">
      <b data-user-name="">
       Student
      </b>
      <span data-user-username="">
       @student
      </span>
     </div>
     <button class="logout" id="logout">
      &rarrhk; Log out
     </button>
    </div>
   </aside>
   <main class="main">
    <header class="topbar">
     <div style="display:flex;align-items:center;gap:10px">
      <button class="mobile-menu">
       ☰
      </button>
      <div>
       <h1>
        Admin Dashboard
       </h1>
       <p>
        Campus-wide community
       </p>
      </div>
     </div>
     <div class="top-actions">
      <div class="avatar" data-avatar="">
       ST
      </div>
     </div>
    </header>
    <div class="container">
     <div id="admin-content">
      <div class="grid grid-3">
       <div class="card stat">
        <div class="num" id="users-count">
         &mdash;
        </div>
        <div class="label">
         Total users
        </div>
       </div>
       <div class="card stat">
        <div class="num" id="messages-count">
         &mdash;
        </div>
        <div class="label">
         Messages
        </div>
       </div>
       <div class="card stat">
        <div class="num" id="posts-count">
         &mdash;
        </div>
        <div class="label">
         Posts
        </div>
       </div>
       <div class="card stat">
        <div class="num" id="reports-count">
         &mdash;
        </div>
        <div class="label">
         Pending reports
        </div>
       </div>
      </div>
      <section class="card" style="margin-top:20px">
       <div class="section-title">
        <h2>
         Reports
        </h2>
        <span class="muted small">
         Moderation queue
        </span>
       </div>
       <div class="table-wrap">
        <table class="table">
         <thead>
          <tr>
           <th>
            User
           </th>
           <th>
            Reason
           </th>
           <th>
            Date
           </th>
           <th>
            Status
           </th>
           <th>
            Action
           </th>
          </tr>
         </thead>
         <tbody id="reports">
         </tbody>
        </table>
       </div>
      </section>
     </div>
    </div>
   </main>
  </div>
  <script src="js/admin.js" type="module">
  </script>
 </body>
</html>
